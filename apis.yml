name: Once
description: 'Once (getonce.com) is a consumer chat and connection platform positioned as an alternative
  to traditional dating apps, offering a pressure-free space for people seeking meaningful connections,
  improved social skills, and guidance in their personal lives. The mobile app surfaces a small number
  of daily matches based on shared interests and vibes, lets users join communities of like-minded people,
  and runs a rewards system called Sparks that members earn and spend on gifts and chat features. Once is
  a Consumer-sector portfolio company of the venture firm Partech. It ships as a consumer mobile application
  and does not currently expose a public developer API, developer portal, or API documentation.'
